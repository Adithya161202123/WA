<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Anniversary</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    overflow-x:hidden;
    background:#ffdce5;
}

/* ---------------- PAGE 1 ---------------- */

.page{
    width:100%;
    height:100vh;
    position:relative;
}

#page1{
    background:linear-gradient(135deg,#ffd6df,#ffc6d6,#ffe7ee);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.bg-hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.bg-hearts span{
    position:absolute;
    display:block;
    color:#ff7da5;
    font-size:20px;
    animation:float 8s linear infinite;
    opacity:0.5;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(0);
    }
    100%{
        transform:translateY(-10vh) scale(1.5);
    }
}

.envelope{
    width:260px;
    height:180px;
    background:#ff7da5;
    position:relative;
    cursor:pointer;
    transition:0.5s;
    border-radius:10px;
    box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

.envelope:hover{
    transform:scale(1.05);
}

.envelope:before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-top:90px solid #ff9fbc;
    transform-origin:top;
    transition:1s;
}

.envelope:hover:before{
    transform:rotateX(180deg);
}

.click-text{
    margin-top:30px;
    font-size:22px;
    color:#c24b73;
    font-weight:600;
}

/* ---------------- PAGE 2 ---------------- */

#page2{
    background:#fff0f5;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:20px;
}

.characters{
    display:flex;
    gap:50px;
    align-items:center;
}

.character{
    text-align:center;
}

.character img{
    width:180px;
}

.chat{
    margin-top:40px;
    width:90%;
    max-width:700px;
}

.bubble{
    padding:18px 22px;
    margin:15px 0;
    border-radius:25px;
    font-size:20px;
    animation:fadeIn 1s forwards;
    opacity:0;
}

.girl{
    background:#ffb3c8;
    color:#6e2240;
    align-self:flex-start;
}

.boy{
    background:#8ed8ff;
    color:#1a3c4f;
    align-self:flex-end;
    text-align:right;
}

@keyframes fadeIn{
    to{
        opacity:1;
    }
}

.next-btn{
    margin-top:30px;
    padding:14px 30px;
    border:none;
    border-radius:40px;
    background:#ff6f9f;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.next-btn:hover{
    background:#ff4f88;
}

/* ---------------- PAGE 3 ---------------- */

#page3{
    background:black;
    overflow:hidden;
    position:relative;
}

.stars{
    position:absolute;
    width:100%;
    height:100%;
}

.star{
    position:absolute;
    width:3px;
    height:100px;
    background:linear-gradient(white,transparent);
    transform:rotate(45deg);
    animation:shoot 3s linear infinite;
}

@keyframes shoot{
    0%{
        transform:translate(-100px,-100px) rotate(45deg);
        opacity:1;
    }
    100%{
        transform:translate(1200px,700px) rotate(45deg);
        opacity:0;
    }
}

.gallery{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.photo{
    position:absolute;
    width:220px;
    height:300px;
    border-radius:20px;
    object-fit:cover;
    box-shadow:0 10px 25px rgba(255,255,255,0.3);
    animation:shuffle 10s infinite;
}

.photo:nth-child(1){animation-delay:0s;}
.photo:nth-child(2){animation-delay:2s;}
.photo:nth-child(3){animation-delay:4s;}
.photo:nth-child(4){animation-delay:6s;}
.photo:nth-child(5){animation-delay:8s;}

@keyframes shuffle{
    0%{
        transform:scale(0.3) rotate(-10deg);
        opacity:0;
    }
    20%{
        transform:scale(1) rotate(0deg);
        opacity:1;
    }
    40%{
        transform:translateX(-250px) rotate(-8deg);
    }
    60%{
        transform:translateX(250px) rotate(8deg);
    }
    80%{
        transform:scale(0.8);
        opacity:1;
    }
    100%{
        transform:scale(0.2);
        opacity:0;
    }
}

.final-text{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
    color:white;
    font-size:30px;
    font-weight:bold;
    letter-spacing:2px;
}

@media(max-width:768px){

.character img{
    width:120px;
}

.bubble{
    font-size:17px;
}

.photo{
    width:160px;
    height:220px;
}
}
</style>
</head>

<body>

<!-- PAGE 1 -->

<section class="page" id="page1">

<div class="bg-hearts">
    <span style="left:10%">❤</span>
    <span style="left:25%; animation-delay:2s;">❤</span>
    <span style="left:40%; animation-delay:4s;">❤</span>
    <span style="left:60%; animation-delay:1s;">❤</span>
    <span style="left:75%; animation-delay:5s;">❤</span>
    <span style="left:90%; animation-delay:3s;">❤</span>
</div>

<div class="envelope" onclick="goToPage2()"></div>

<div class="click-text">
    Tap the Envelope 💌
</div>

</section>

<!-- PAGE 2 -->

<section class="page" id="page2">

<div class="characters">

<div class="character">
<img src="https://cdn-icons-png.flaticon.com/512/6997/6997662.png">
</div>

<div class="character">
<img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">
</div>

</div>

<div class="chat">

<div class="bubble girl" style="animation-delay:1s;">
What expression should I give today? 🌸
</div>

<div class="bubble boy" style="animation-delay:3s;">
It’s our third anniversary ❤️
</div>

<div class="bubble girl" style="animation-delay:5s;">
Then let’s make this moment timeless ✨
</div>

</div>

<button class="next-btn" onclick="goToPage3()">
Continue ✨
</button>

</section>

<!-- PAGE 3 -->

<section class="page" id="page3">

<div class="stars" id="stars"></div>

<div class="gallery">

<!-- Replace these with your own images -->

<img class="photo" src="https://picsum.photos/id/1011/500/700">
<img class="photo" src="https://picsum.photos/id/1012/500/700">
<img class="photo" src="https://picsum.photos/id/1015/500/700">
<img class="photo" src="https://picsum.photos/id/1016/500/700">
<img class="photo" src="https://picsum.photos/id/1025/500/700">

</div>

<div class="final-text">
Happy 3rd Anniversary 💖
</div>

</section>

<script>

function goToPage2(){
    document.getElementById('page2').scrollIntoView({
        behavior:'smooth'
    });
}

function goToPage3(){
    document.getElementById('page3').scrollIntoView({
        behavior:'smooth'
    });
}

/* shooting stars */

const stars = document.getElementById('stars');

for(let i=0;i<25;i++){

    let star = document.createElement('div');
    star.classList.add('star');

    star.style.left = Math.random()*window.innerWidth + 'px';
    star.style.top = Math.random()*window.innerHeight + 'px';

    star.style.animationDelay = Math.random()*5 + 's';

    stars.appendChild(star);
}

</script>

</body>
</html>
