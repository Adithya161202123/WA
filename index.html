<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    overflow-x:hidden;
    background:#ffdbe7;
}

.page{
    width:100%;
    min-height:100vh;
    position:relative;
}

/* ---------------- PAGE 1 ---------------- */

#page1{
    background:linear-gradient(135deg,#ffd6e0,#ffe6ee,#ffdbe7);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;
}

.hearts{
    position:absolute;
    width:100%;
    height:100%;
}

.hearts span{
    position:absolute;
    color:#ff7ca8;
    font-size:22px;
    animation:float 8s linear infinite;
    opacity:0.5;
}

@keyframes float{
    0%{ transform:translateY(100vh) scale(0); }
    100%{ transform:translateY(-20vh) scale(1.4); }
}

.envelope{
    width:260px;
    height:180px;
    background:#ff6f9f;
    position:relative;
    border-radius:12px;
    cursor:pointer;
    transition:0.5s;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.envelope:hover{
    transform:scale(1.05);
}

.envelope::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-top:90px solid #ff99ba;
    transition:1s;
    transform-origin:top;
}

.envelope:hover::before{
    transform:rotateX(180deg);
}

.open-text{
    margin-top:30px;
    font-size:24px;
    color:#c43f72;
    font-weight:600;
}

/* ---------------- PAGE 2 ---------------- */

#page2{
    background:linear-gradient(180deg,#fff0f6,#ffe3ec);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px 20px;
}

.scene{
    position:relative;
    width:100%;
    height:220px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;
    overflow:hidden;
}

/* Circular wrapper — clips to a circle */
.avatar-wrap{
    width:160px;
    height:160px;
    border-radius:50%;
    overflow:hidden;
    border:4px solid #ff6f9f;
    box-shadow:0 8px 28px rgba(255,111,159,0.35);
    flex-shrink:0;
    position:relative;
    background:#ffe0ef;
}

/* Full image fits inside circle — no cropping at all */
.girl-character,
.boy-character{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
    display:block;
    background:#ffe0ef;
}

/* Slide in from sides via the wrapper */
.girl-wrap{
    transform:translateX(-400px);
    opacity:0;
}

.boy-wrap{
    transform:translateX(400px);
    opacity:0;
}

.girl-wrap.active,
.boy-wrap.active{
    transform:translateX(0);
    opacity:1;
}

/* Labels under avatars */
.avatar-label{
    text-align:center;
    margin-top:10px;
    font-size:14px;
    font-weight:600;
    color:#c43f72;
}

.avatar-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:2s ease-in-out;
    transform:translateX(-400px);
    opacity:0;
}

.avatar-col.boy-col{
    transform:translateX(400px);
}

.avatar-col.active{
    transform:translateX(0);
    opacity:1;
}

/* ---------------- CONVERSATION BOX ---------------- */

.conversation-box{
    width:90%;
    max-width:700px;
    min-height:240px;
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* Each message row controls alignment */
.msg-row{
    display:flex;
}

.msg-row.girl-row{
    justify-content:flex-start;
}

.msg-row.boy-row{
    justify-content:flex-end;
}

/* The bubble itself is only as wide as its text */
.message{
    padding:14px 20px;
    border-radius:25px;
    font-size:18px;
    animation:fadeUp 0.7s ease;
    width:fit-content;        /* ← KEY: shrinks to text length */
    max-width:85%;            /* ← never overflow on small screens */
    white-space:pre-wrap;     /* respect natural line breaks */
    word-break:break-word;
}

.girl-msg{
    background:#ffb6cc;
    color:#6b1f40;
    border-bottom-left-radius:6px;
}

.boy-msg{
    background:#9edfff;
    color:#183a4b;
    border-bottom-right-radius:6px;
    text-align:left;          /* text inside stays left even when row is right-aligned */
}

.hidden{
    display:none !important;
}

@keyframes fadeUp{
    from{ opacity:0; transform:translateY(20px); }
    to{ opacity:1; transform:translateY(0); }
}

.chat-button,
.continue-button{
    margin-top:25px;
    padding:14px 28px;
    border:none;
    border-radius:40px;
    background:#ff5d94;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 8px 18px rgba(0,0,0,0.15);
}

.chat-button:hover,
.continue-button:hover{
    transform:scale(1.05);
}

/* ---------------- PAGE 3 ---------------- */

#page3{
    background:black;
    overflow:hidden;
    position:relative;
    height:100vh;
}

/* Full-screen slideshow */
.slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
    background:#000;
    opacity:0;
    transition:opacity 1.8s ease-in-out;
    z-index:1;
}

.slide.active{
    opacity:1;
    z-index:2;
}

/* Subtle dark overlay so text stays readable */
#page3::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 50%);
    z-index:3;
    pointer-events:none;
}

.final-text{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
    color:white;
    font-size:32px;
    font-weight:700;
    letter-spacing:2px;
    z-index:4;
    text-shadow:0 2px 12px rgba(0,0,0,0.6);
}

/* Slide counter dot strip */
.dot-strip{
    position:absolute;
    top:18px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:5px;
    z-index:4;
    flex-wrap:wrap;
    padding:0 16px;
}

.dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255,255,255,0.35);
    transition:background 0.4s;
    flex-shrink:0;
}

.dot.active{
    background:rgba(255,255,255,0.95);
}

/* ---------------- FLOATING WORDS ---------------- */

.fly-word{
    position:absolute;
    color:rgba(255,255,255,0.18);
    font-family:'Poppins',sans-serif;
    font-weight:600;
    pointer-events:none;
    z-index:5;
    white-space:nowrap;
    animation:flyWord linear forwards;
    letter-spacing:2px;
    text-transform:uppercase;
}

@keyframes flyWord{
    0%{
        opacity:0;
        transform:translate(0,0) rotate(var(--rot)) scale(0.6);
    }
    15%{
        opacity:1;
    }
    80%{
        opacity:0.22;
    }
    100%{
        opacity:0;
        transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.1);
    }
}

/* ---------------- MOBILE ---------------- */

@media(max-width:768px){
    .avatar-wrap{ width:120px; height:120px; }
    .scene{ gap:30px; height:200px; }
    .message{ font-size:16px; }
    .final-text{ font-size:24px; }
    .open-text{ font-size:20px; }
}

</style>
</head>
<body>

<!-- ================= PAGE 1 ================= -->

<section class="page" id="page1">
    <div class="hearts">
        <span style="left:10%">❤</span>
        <span style="left:20%;animation-delay:2s;">❤</span>
        <span style="left:35%;animation-delay:4s;">❤</span>
        <span style="left:50%;animation-delay:1s;">❤</span>
        <span style="left:65%;animation-delay:3s;">❤</span>
        <span style="left:80%;animation-delay:5s;">❤</span>
        <span style="left:90%;animation-delay:2s;">❤</span>
    </div>
    <div class="envelope" onclick="goToPage2()"></div>
    <div class="open-text">Tap The Envelope 💌</div>
</section>

<!-- ================= PAGE 2 ================= -->

<section class="page" id="page2">

    <div class="scene">

        <!-- Girl avatar — slides in from left -->
        <div class="avatar-col" id="girlCol">
            <div class="avatar-wrap">
                <img
                    src="https://raw.githubusercontent.com/Adithya161202123/WA/main/Screenshot_20260512_134721 (1).jpg"
                    class="girl-character"
                    id="girl"
                    alt="Her">
            </div>
            <div class="avatar-label">Chum 💖</div>
        </div>

        <!-- Boy avatar — slides in from right -->
        <div class="avatar-col boy-col" id="boyCol">
            <div class="avatar-wrap">
                <img
                    src="https://raw.githubusercontent.com/Adithya161202123/WA/main/Screenshot_20260512_134748 (1).jpg"
                    class="boy-character"
                    id="boy"
                    alt="Him">
            </div>
            <div class="avatar-label">Chumbi 💙</div>
        </div>

    </div>

    <div class="conversation-box">

        <!-- Each row wraps one bubble; row alignment = left/right; bubble width = text width -->

        <div class="msg-row girl-row hidden" id="msg1">
            <div class="message girl-msg">Heyy Chumbi 💖 What is special today?</div>
        </div>

        <div class="msg-row boy-row hidden" id="msg2">
            <div class="message boy-msg">It's our anniversary, 3rd wedding anniversary 🌸</div>
        </div>

        <div class="msg-row girl-row hidden" id="msg3">
            <div class="message girl-msg">Awww... It's been 3 years... Time flies.... then today should be magical ✨</div>
        </div>

        <div class="msg-row boy-row hidden" id="msg4">
            <div class="message boy-msg">Every moment with you already is ❤️</div>
        </div>

    </div>

    <button id="chatBtn" class="chat-button">Click Here 💌</button>
    <button id="continueBtn" class="continue-button hidden">Continue ✨</button>

</section>

<!-- ================= PAGE 3 ================= -->

<section class="page" id="page3">

    <div id="slideshow"></div>
    <div id="wordLayer"></div>
    <div class="dot-strip" id="dots"></div>
    <div class="final-text">Happy 3rd Anniversary 💖</div>

</section>

<script>

/* PAGE 1 → PAGE 2 */
function goToPage2(){
    document.getElementById('page2').scrollIntoView({ behavior:'smooth' });
    setTimeout(() => {
        document.getElementById('girlCol').classList.add('active');
        document.getElementById('boyCol').classList.add('active');
    }, 500);
}

/* PAGE 2 → PAGE 3 */
function goToPage3(){
    document.getElementById('page3').scrollIntoView({ behavior:'smooth' });
}

/* CHAT FLOW */
const messages = [
    document.getElementById('msg1'),
    document.getElementById('msg2'),
    document.getElementById('msg3'),
    document.getElementById('msg4')
];

let currentMessage = 0;
const chatBtn = document.getElementById('chatBtn');
const continueBtn = document.getElementById('continueBtn');

chatBtn.addEventListener('click', () => {
    if(currentMessage < messages.length){
        messages[currentMessage].classList.remove('hidden');
        currentMessage++;
    }
    if(currentMessage === messages.length){
        chatBtn.classList.add('hidden');
        continueBtn.classList.remove('hidden');
    }
});

continueBtn.addEventListener('click', () => { goToPage3(); });

/* SHOOTING STARS removed — replaced by slideshow */

/* ---- 51-IMAGE FULL-SCREEN CROSSFADE SLIDESHOW ---- */

const photoIds = [
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0004.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0005.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0006.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0007.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0008.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0009.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0010.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0011.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0012.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0013.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0014.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0015.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0016.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0017.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0018.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0019.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0020.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0021.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0022.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0023.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0024.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0025.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0026.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0027.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0028.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0029.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0030.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0031.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0032.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0033.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0034.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0035.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0036.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0037.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0038.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0039.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0040.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0041.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0042.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0043.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0044.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0045.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0046.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0047.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0048.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0049.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0050.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0051.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0052.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0053.jpg',
    'https://raw.githubusercontent.com/Adithya161202123/WA/main/IMG-20260512-WA0054.jpg'
];

const slideshowEl = document.getElementById('slideshow');
const dotsEl      = document.getElementById('dots');

/* Build all img elements + dots */
photoIds.forEach((url, i) => {
    const img = document.createElement('img');
    img.className = 'slide' + (i === 0 ? ' active' : '');
    img.src = url;
    img.alt = `Memory ${i + 1}`;
    slideshowEl.appendChild(img);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dotsEl.appendChild(dot);
});

const slides = document.querySelectorAll('.slide');
const dots   = document.querySelectorAll('.dot');
let current  = 0;

function nextSlide(){
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
}

/* Each photo shows for 3.5 s, crossfade takes 1.8 s */
setInterval(nextSlide, 3500);

/* ---- FLOATING WORDS ---- */

const wordList = [
    'Love','Life','Us','Forever','Always','Dream','Heart',
    'Together','Joy','Bliss','Magic','Soul','Smile','Cherish',
    'Destiny','Stars','Believe','Grow','Journey','Bond',
    'Trust','Hope','Laugh','Dance','Glow','Infinity',
    'Yours','Mine','Ours','Memories','Warmth','Sunrise',
    'Home','Peace','Grace','Tender','Wild','Free','Spark',
    'Adore','Eternal','Breathe','Wonder','Precious','True'
];

const wordLayer = document.getElementById('wordLayer');

function spawnWord(){
    const word = document.createElement('span');
    word.className = 'fly-word';
    word.textContent = wordList[Math.floor(Math.random() * wordList.length)];

    /* Random start position anywhere on screen */
    const startX = Math.random() * 90;   /* % from left */
    const startY = Math.random() * 85;   /* % from top  */
    word.style.left = startX + '%';
    word.style.top  = startY + '%';

    /* Random font size between 14px and 52px */
    const size = 14 + Math.floor(Math.random() * 39);
    word.style.fontSize = size + 'px';

    /* Random travel direction & distance */
    const dx = (Math.random() - 0.5) * 260;   /* -130 to +130 px */
    const dy = (Math.random() - 0.5) * 260;
    const rot = (Math.random() - 0.5) * 40;   /* -20 to +20 deg  */
    word.style.setProperty('--dx', dx + 'px');
    word.style.setProperty('--dy', dy + 'px');
    word.style.setProperty('--rot', rot + 'deg');

    /* Random duration 5s – 11s */
    const dur = 5 + Math.random() * 6;
    word.style.animationDuration = dur + 's';

    wordLayer.appendChild(word);

    /* Remove from DOM after animation ends */
    setTimeout(() => word.remove(), dur * 1000 + 100);
}

/* Spawn a word every 400 ms */
setInterval(spawnWord, 400);
/* Seed a few immediately */
for(let i = 0; i < 8; i++) setTimeout(spawnWord, i * 120);

</script>
</body>
</html>
